name: TODO Issue CI

on:
  push:
    branches:
      - "staging"
  workflow_dispatch:
    inputs:
      importAll:
        default: false
        required: false
        type: boolean
        description: Enable, if you want to import all TODOs. Runs on checked out branch! Only use if you're sure what you are doing.

# jobs:
#   todos:
#     name: Create Issues from TODO
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v7
#       - name: todo-actions
#         uses: dtinth/todo-actions@v0.2.0
#         env:
#           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#           TODO_ACTIONS_MONGO_URL: ${{ secrets.TODO_ACTIONS_MONGO_URL }}

permissions:
  issues: write
  repository-projects: read
  contents: read

jobs:
  todos:
    name: Create Issues from TODO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox markers
        uses: actions/checkout@v4
        with:
          sparse-checkout: .mock
          persist-credentials: false
      - name: Mock todos
        working-directory: ${{ github.workspace }}
        env:
          MOCK_JOB: todos
          MOCK_MATRIX: ${{ toJSON(matrix) }}
        run: |
          echo "mock: $GITHUB_WORKFLOW / $MOCK_JOB on $GITHUB_EVENT_NAME at $GITHUB_SHA"
          echo "matrix: $MOCK_MATRIX"
          sleep "$(cat .mock/sleep 2>/dev/null || echo 15)"
          if [ -f .mock/fail ] && grep -qxE "($GITHUB_EVENT_NAME/)?$MOCK_JOB" .mock/fail; then
            echo "::error::.mock/fail makes $MOCK_JOB fail on $GITHUB_EVENT_NAME"
            exit 1
          fi
